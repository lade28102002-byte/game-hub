<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zombie Survival - GameZone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #070b09;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .top-bar {
            height: 70px;
            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #0c120e;
            border-bottom: 1px solid #253329;
        }

        .logo {
            color: white;
            text-decoration: none;

            font-size: 22px;
            font-weight: 900;
        }

        .logo span {
            color: #67e36f;
        }

        .back-button {
            padding: 10px 18px;

            background: #172018;
            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-size: 13px;
        }

        .back-button:hover {
            background: #67e36f;
            color: #071008;
        }

        .game-wrapper {
            width: 100%;
            max-width: 1000px;

            margin: auto;

            padding: 30px 20px;
        }

        .game-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .game-header h1 {
            font-size: 28px;
        }

        .game-header p {
            color: #7e8a81;
            font-size: 13px;

            margin-top: 5px;
        }

        .stats {
            display: flex;
            gap: 10px;
        }

        .stat-box {
            min-width: 100px;

            padding: 10px 15px;

            text-align: center;

            background: #111912;

            border: 1px solid #29372c;

            border-radius: 7px;
        }

        .stat-box small {
            display: block;

            color: #778279;

            font-size: 10px;

            margin-bottom: 4px;
        }

        .stat-box span {
            font-size: 17px;

            font-weight: bold;

            color: #67e36f;
        }

        .health span {
            color: #ff5757;
        }

        .canvas-wrapper {
            position: relative;

            width: 100%;

            overflow: hidden;

            border: 2px solid #29372c;

            border-radius: 10px;

            background: #0a100c;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;

            width: 100%;
            height: auto;

            cursor: crosshair;
        }

        .start-screen {
            position: absolute;

            inset: 0;

            z-index: 10;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            background: rgba(3, 8, 5, 0.86);
        }

        .start-screen h2 {
            color: #67e36f;

            font-size: 40px;

            margin-bottom: 12px;
        }

        .start-screen p {
            color: #aab4ac;

            line-height: 1.7;

            margin-bottom: 25px;
        }

        .start-button {
            padding: 13px 28px;

            border: none;

            border-radius: 6px;

            background: #67e36f;

            color: #071008;

            font-weight: bold;

            cursor: pointer;
        }

        .start-button:hover {
            background: #8af28f;
        }

        .controls {
            margin-top: 18px;

            display: flex;

            justify-content: center;

            gap: 18px;

            flex-wrap: wrap;

            color: #707b73;

            font-size: 13px;
        }

        .key {
            display: inline-block;

            padding: 5px 8px;

            margin: 0 2px;

            background: #151d17;

            border: 1px solid #2b392e;

            border-radius: 4px;

            color: white;
        }

        @media (max-width: 700px) {

            .game-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .stats {
                width: 100%;
            }

            .stat-box {
                flex: 1;
            }

            .start-screen h2 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header class="top-bar">

    <a href="../index.html" class="logo">
        <span>GAME</span>ZONE
    </a>

    <a href="../index.html" class="back-button">
        ← Quay lại
    </a>

</header>


<main class="game-wrapper">

    <div class="game-header">

        <div>
            <h1>🧟 Zombie Survival</h1>

            <p>
                Tiêu diệt zombie và sống sót càng lâu càng tốt.
            </p>
        </div>

        <div class="stats">

            <div class="stat-box">
                <small>SCORE</small>
                <span id="score">0</span>
            </div>

            <div class="stat-box health">
                <small>HP</small>
                <span id="health">100</span>
            </div>

        </div>

    </div>


    <div class="canvas-wrapper">

        <canvas
            id="gameCanvas"
            width="900"
            height="600">
        </canvas>


        <div
            class="start-screen"
            id="startScreen">

            <h2>ZOMBIE SURVIVAL</h2>

            <p>
                WASD hoặc phím mũi tên để di chuyển.<br>
                Di chuyển chuột để ngắm và click để bắn.
            </p>

            <button
                class="start-button"
                id="startButton">

                BẮT ĐẦU CHƠI

            </button>

        </div>

    </div>


    <div class="controls">

        <span>
            <span class="key">W A S D</span>
            Di chuyển
        </span>

        <span>
            <span class="key">CLICK</span>
            Bắn
        </span>

    </div>

</main>


<script src="zombie.js"></script>

</body>
</html>
