<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highway Racer - GameZone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #07090d;
            color: white;
            font-family: Arial, sans-serif;
        }

        .top-bar {
            height: 70px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d1016;
            border-bottom: 1px solid #242833;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: 900;
        }

        .logo span {
            color: #ff3d81;
        }

        .back-button {
            padding: 10px 18px;
            background: #191d27;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
        }

        .back-button:hover {
            background: #ff3d81;
        }

        .game-wrapper {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .game-header h1 {
            font-size: 28px;
        }

        .game-header p {
            color: #888e9b;
            font-size: 13px;
            margin-top: 5px;
        }

        .score-box {
            padding: 10px 18px;
            background: #11151f;
            border: 1px solid #292e3b;
            border-radius: 7px;
            font-weight: bold;
        }

        .score-box span {
            color: #ff3d81;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: auto;
            overflow: hidden;
            border: 2px solid #292e3b;
            border-radius: 10px;
            background: #222;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .start-screen {
            position: absolute;
            inset: 0;
            z-index: 5;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.75);
        }

        .start-screen h2 {
            color: #ff3d81;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .start-screen p {
            color: #bbb;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .start-button {
            padding: 13px 28px;
            border: none;
            border-radius: 6px;

            background: #ff3d81;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .start-button:hover {
            background: #ff5a94;
        }

        .controls {
            text-align: center;
            color: #777d89;
            font-size: 13px;
            margin-top: 18px;
        }

        .key {
            display: inline-block;
            padding: 5px 9px;
            margin: 0 3px;

            background: #171b25;
            border: 1px solid #292e3b;
            border-radius: 4px;

            color: white;
        }

        @media (max-width: 600px) {
            .game-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

<header class="top-bar">

    <a href="../index.html" class="logo">
        <span>GAME</span>ZONE
    </a>

    <a href="../index.html" class="back-button">
        ← Quay lại
    </a>

</header>


<main class="game-wrapper">

    <div class="game-header">

        <div>
            <h1>🏎️ Highway Racer</h1>

            <p>
                Né xe và chạy càng xa càng tốt.
            </p>
        </div>

        <div class="score-box">
            SCORE:
            <span id="score">0</span>
        </div>

    </div>


    <div class="canvas-wrapper">

        <canvas
            id="gameCanvas"
            width="700"
            height="700">
        </canvas>


        <div
            class="start-screen"
            id="startScreen">

            <h2>HIGHWAY RACER</h2>

            <p>
                Điều khiển xe để né những chiếc xe khác.<br>
                Càng chạy lâu, tốc độ càng tăng.
            </p>

            <button
                class="start-button"
                id="startButton">

                BẮT ĐẦU CHƠI

            </button>

        </div>

    </div>


    <div class="controls">

        <span class="key">←</span>
        <span class="key">→</span>

        Di chuyển xe

    </div>

</main>


<script src="racing.js"></script>

</body>
</html>
