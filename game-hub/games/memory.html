<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Cards - GameZone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background: #090b12;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .top-bar {
            height: 70px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: #11141d;

            border-bottom:
                1px solid #292e3b;
        }

        .logo {
            color: white;

            text-decoration: none;

            font-size: 22px;

            font-weight: 900;
        }

        .logo span {
            color: #6366f1;
        }

        .back-button {
            padding:
                10px 18px;

            background: #1a1e28;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-size: 13px;
        }

        .back-button:hover {
            background: #6366f1;
        }

        .game-wrapper {
            width: 100%;

            max-width: 750px;

            margin: auto;

            padding: 30px 20px;
        }

        .game-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 20px;
        }

        .game-header h1 {
            font-size: 28px;
        }

        .game-header p {
            margin-top: 5px;

            color: #858b99;

            font-size: 13px;
        }

        .stats {
            display: flex;

            gap: 10px;
        }

        .stat-box {
            min-width: 90px;

            padding:
                10px 15px;

            background: #141821;

            border:
                1px solid #2a303e;

            border-radius: 7px;

            text-align: center;
        }

        .stat-box small {
            display: block;

            color: #777e8d;

            font-size: 10px;

            margin-bottom: 4px;
        }

        .stat-box span {
            color: #818cf8;

            font-size: 17px;

            font-weight: bold;
        }

        .memory-board {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            padding: 12px;

            background: #141821;

            border:
                1px solid #2a303e;

            border-radius: 12px;
        }

        .card {
            position: relative;

            aspect-ratio: 1 / 1;

            border: none;

            background: transparent;

            cursor: pointer;

            perspective: 700px;
        }

        .card-inner {
            position: absolute;

            inset: 0;

            transition:
                transform 0.45s;

            transform-style:
                preserve-3d;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform:
                rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 9px;

            backface-visibility:
                hidden;
        }

        .card-front {
            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #4338ca
                );

            border:
                1px solid #818cf8;

            font-size: 28px;

            color: white;
        }

        .card-back {
            background: #202532;

            border:
                1px solid #343b4b;

            transform:
                rotateY(180deg);

            font-size: 40px;
        }

        .card.matched .card-back {
            background: #18271f;

            border:
                1px solid #22c55e;

            box-shadow:
                0 0 15px
                rgba(
                    34,
                    197,
                    94,
                    0.25
                );
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 22px;
        }

        .button {
            padding:
                12px 24px;

            border: none;

            border-radius: 6px;

            background: #6366f1;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .button:hover {
            background: #818cf8;
        }

        .result {
            min-height: 25px;

            margin-top: 16px;

            text-align: center;

            color: #c8cdd6;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            .game-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .stats {
                width: 100%;
            }

            .stat-box {
                flex: 1;
            }

            .memory-board {
                grid-template-columns:
                    repeat(4, 1fr);

                gap: 7px;

                padding: 7px;
            }

            .card-back {
                font-size: 28px;
            }

        }
    </style>
</head>

<body>

<header class="top-bar">

    <a href="../index.html" class="logo">
        <span>GAME</span>ZONE
    </a>

    <a href="../index.html" class="back-button">
        ← Quay lại
    </a>

</header>


<main class="game-wrapper">

    <div class="game-header">

        <div>

            <h1>🃏 Memory Cards</h1>

            <p>
                Tìm tất cả các cặp thẻ giống nhau.
            </p>

        </div>


        <div class="stats">

            <div class="stat-box">

                <small>MOVES</small>

                <span id="moves">
                    0
                </span>

            </div>


            <div class="stat-box">

                <small>PAIRS</small>

                <span id="pairs">
                    0/8
                </span>

            </div>

        </div>

    </div>


    <div
        class="memory-board"
        id="memoryBoard">
    </div>


    <div
        class="result"
        id="result">
    </div>


    <div class="buttons">

        <button
            class="button"
            id="restartButton">

            CHƠI LẠI

        </button>

    </div>

</main>


<script src="memory.js"></script>

</body>
</html>
