<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe - GameZone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #090b12;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .top-bar {
            height: 70px;
            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: #11141d;
            border-bottom: 1px solid #292e3b;
        }

        .logo {
            color: white;
            text-decoration: none;

            font-size: 22px;
            font-weight: 900;
        }

        .logo span {
            color: #a855f7;
        }

        .back-button {
            padding: 10px 18px;

            background: #1a1e28;
            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-size: 13px;
        }

        .back-button:hover {
            background: #a855f7;
            color: white;
        }

        .game-wrapper {
            width: 100%;
            max-width: 700px;

            margin: auto;

            padding: 40px 20px;
        }

        .game-header {
            text-align: center;

            margin-bottom: 25px;
        }

        .game-header h1 {
            font-size: 30px;
        }

        .game-header p {
            margin-top: 8px;

            color: #858b99;

            font-size: 13px;
        }

        .score-board {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-bottom: 25px;
        }

        .score-box {
            width: 130px;

            padding: 12px;

            background: #141821;

            border: 1px solid #2a303e;

            border-radius: 8px;

            text-align: center;
        }

        .score-box small {
            display: block;

            color: #777e8d;

            font-size: 10px;

            margin-bottom: 5px;
        }

        .score-box span {
            font-size: 22px;

            font-weight: bold;
        }

        #xScore {
            color: #38bdf8;
        }

        #oScore {
            color: #f472b6;
        }

        .turn {
            padding: 14px;

            margin-bottom: 20px;

            background: #141821;

            border: 1px solid #2a303e;

            border-radius: 8px;

            text-align: center;

            color: #b4bac6;
        }

        #turnText {
            color: #a855f7;

            font-weight: bold;
        }

        .board {
            width: 360px;
            height: 360px;

            max-width: 100%;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            padding: 10px;

            background: #181c27;

            border: 1px solid #303644;

            border-radius: 12px;
        }

        .cell {
            border: none;

            border-radius: 8px;

            background: #0e1118;

            color: white;

            font-size: 60px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.15s,
                transform 0.15s;
        }

        .cell:hover {
            background: #1b202b;

            transform: scale(0.97);
        }

        .cell.x {
            color: #38bdf8;
        }

        .cell.o {
            color: #f472b6;
        }

        .cell.winner {
            background: #272d3a;

            box-shadow:
                0 0 20px
                rgba(168, 85, 247, 0.35);
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 25px;
        }

        .button {
            padding: 12px 22px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

            background: #a855f7;

            color: white;
        }

        .button:hover {
            background: #b86aff;
        }

        .button.secondary {
            background: #1a1e28;

            border: 1px solid #303644;

            color: #c9ced8;
        }

        .button.secondary:hover {
            background: #242936;
        }

        .result {
            min-height: 25px;

            margin-top: 18px;

            text-align: center;

            color: #c8cdd6;

            font-size: 14px;
        }

        @media (max-width: 500px) {

            .board {
                width: 320px;
                height: 320px;
            }

            .cell {
                font-size: 50px;
            }

        }
    </style>
</head>

<body>

<header class="top-bar">

    <a href="../index.html" class="logo">
        <span>GAME</span>ZONE
    </a>

    <a href="../index.html" class="back-button">
        ← Quay lại
    </a>

</header>


<main class="game-wrapper">

    <div class="game-header">

        <h1>❌⭕ Tic Tac Toe</h1>

        <p>
            Trò chơi 2 người chơi trên cùng một máy.
        </p>

    </div>


    <div class="score-board">

        <div class="score-box">

            <small>
                PLAYER X
            </small>

            <span id="xScore">
                0
            </span>

        </div>


        <div class="score-box">

            <small>
                HÒA
            </small>

            <span id="drawScore">
                0
            </span>

        </div>


        <div class="score-box">

            <small>
                PLAYER O
            </small>

            <span id="oScore">
                0
            </span>

        </div>

    </div>


    <div class="turn">

        Lượt chơi:
        <span id="turnText">
            X
        </span>

    </div>


    <div
        class="board"
        id="board">

        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>

    </div>


    <div
        class="result"
        id="result">
    </div>


    <div class="buttons">

        <button
            class="button"
            id="newGame">

            VÁN MỚI

        </button>


        <button
            class="button secondary"
            id="resetScore">

            RESET ĐIỂM

        </button>

    </div>

</main>


<script src="tictactoe.js"></script>

</body>
</html>
