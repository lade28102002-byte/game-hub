<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Space Shooter - GameZone</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            background: #070912;
            color: white;

            font-family: Arial, Helvetica, sans-serif;
        }

        /* HEADER */

        .top-bar {
            width: 100%;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            background: #0d101b;
            border-bottom: 1px solid #242838;
        }

        .logo {
            color: white;
            text-decoration: none;

            font-size: 22px;
            font-weight: 900;
        }

        .logo span {
            color: #ff3d81;
        }

        .back-button {
            padding: 10px 18px;

            border-radius: 6px;

            background: #191d2a;

            color: white;
            text-decoration: none;

            font-size: 13px;

            transition: 0.3s;
        }

        .back-button:hover {
            background: #ff3d81;
        }

        /* GAME AREA */

        .game-wrapper {
            width: 100%;
            max-width: 1000px;

            padding: 35px 20px;
        }

        .game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .game-header h1 {
            font-size: 28px;
        }

        .game-header p {
            color: #858a98;
            font-size: 13px;
            margin-top: 5px;
        }

        .score-box {
            padding: 10px 18px;

            background: #111522;

            border: 1px solid #292e40;

            border-radius: 7px;

            font-weight: bold;
        }

        .score-box span {
            color: #ff3d81;
        }

        /* CANVAS */

        .canvas-container {
            position: relative;

            width: 100%;

            border: 2px solid #292e40;

            border-radius: 10px;

            overflow: hidden;

            background: #02030a;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;

            width: 100%;

            height: auto;

            background: #02030a;
        }

        /* START SCREEN */

        .start-screen {
            position: absolute;

            inset: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            background: rgba(2, 3, 10, 0.82);

            z-index: 10;
        }

        .start-screen h2 {
            font-size: 38px;

            margin-bottom: 10px;

            color: #ff3d81;
        }

        .start-screen p {
            color: #a4a8b4;

            margin-bottom: 25px;

            text-align: center;
        }

        .start-button {
            border: none;

            padding: 13px 28px;

            background: #ff3d81;

            color: white;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;
        }

        .start-button:hover {
            background: #ff5a94;
        }

        /* CONTROLS */

        .controls {
            margin-top: 18px;

            display: flex;

            justify-content: center;

            gap: 25px;

            flex-wrap: wrap;

            color: #777d8d;

            font-size: 13px;
        }

        .control-key {
            padding: 5px 9px;

            background: #151925;

            border: 1px solid #282d3d;

            border-radius: 4px;

            color: #d9dbe2;
        }

        @media (max-width: 600px) {

            .game-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 12px;
            }

            .start-screen h2 {
                font-size: 28px;
            }

        }
    </style>
</head>

<body>

    <header class="top-bar">

        <a href="../index.html" class="logo">
            <span>GAME</span>ZONE
        </a>

        <a href="../index.html" class="back-button">
            ← Quay lại
        </a>

    </header>


    <main class="game-wrapper">

        <div class="game-header">

            <div>
                <h1>🚀 Space Shooter</h1>

                <p>
                    Điều khiển phi thuyền và tiêu diệt kẻ địch.
                </p>
            </div>

            <div class="score-box">
                SCORE:
                <span id="score">0</span>
            </div>

        </div>


        <div class="canvas-container">

            <canvas
                id="gameCanvas"
                width="900"
                height="550"
            ></canvas>


            <div
                class="start-screen"
                id="startScreen"
            >

                <h2>SPACE SHOOTER</h2>

                <p>
                    Sử dụng phím mũi tên để di chuyển.<br>
                    Nhấn SPACE để bắn.
                </p>

                <button
                    class="start-button"
                    id="startButton"
                >
                    BẮT ĐẦU CHƠI
                </button>

            </div>

        </div>


        <div class="controls">

            <span>
                <span class="control-key">←</span>
                <span class="control-key">→</span>
                Di chuyển
            </span>

            <span>
                <span class="control-key">SPACE</span>
                Bắn
            </span>

        </div>

    </main>


    <script src="shooter.js"></script>

</body>
</html>
